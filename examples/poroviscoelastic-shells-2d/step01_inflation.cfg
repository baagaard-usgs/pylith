[pylithapp.metadata]
base = [pylithapp.cfg]
description = Fully saturated, isothermal injection with a constant, large fluid bulk modulus.
keywords = [quadrilateral cells]
arguments = [step01_inflation.cfg]


# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem]
# Set the name of the problem that will be used to construct the
# output filenames. The default directory for output is 'output'.
defaults.name = step01_inflation

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
# For time-dependent problems, we specify start and end times and an initial
# time step. With an initial time step of 0.2 yr, we use a start time of
# -0.2 yr so that the first solution occurs at 0 days.
[pylithapp.timedependent]
# start_time = -0.2*year
start_time = 0.0*year
initial_dt = 0.2*year
end_time = 100.0*year

# ----------------------------------------------------------------------
# initial conditions
# ----------------------------------------------------------------------
# [pylithapp.problem]
# ic = [inner_chamber, outer_chamber]
# ic.inner_chamber = pylith.problems.InitialConditionPatch
# ic.outer_chamber = pylith.problems.InitialConditionPatch

# [pylithapp.problem.ic.inner_chamber]
# label_value = 9
# db = spatialdata.spatialdb.UniformDB
# db.description = Initial conditions for the inner chamber
# db.values = [displacement_x, displacement_y, pressure, trace_strain]
# db.data = [0.0*m, 0.0*m, 5.0*MPa, 0.0]

# [pylithapp.problem.ic.outer_chamber]
# label_value = 8
# db = spatialdata.spatialdb.UniformDB
# db.description = Initial conditions for the outer chamber
# db.values = [displacement_x, displacement_y, pressure, trace_strain]
# db.data = [0.0*m, 0.0*m, 5.0*MPa, 0.0]

[pylithapp.problem]
ic = [domain]
ic.domain = pylith.problems.InitialConditionDomain

[pylithapp.problem.ic.domain]
db = spatialdata.spatialdb.UniformDB
db.description = Initial conditions for domain
db.values = [displacement_x, displacement_y, pressure, trace_strain]
db.data = [0.0*m, 0.0*m, 5.0*MPa, 0.0]

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]

bc = [bc_xneg, bc_xpos, bc_yneg, bc_ypos, cavity, outer_chamber]

bc.bc_xneg = pylith.bc.DirichletTimeDependent
bc.bc_xpos = pylith.bc.DirichletTimeDependent
bc.bc_yneg = pylith.bc.DirichletTimeDependent
bc.bc_ypos = pylith.bc.DirichletTimeDependent
bc.cavity = pylith.bc.DirichletTimeDependent
bc.outer_chamber = pylith.bc.DirichletTimeDependent


# The `label` corresponds to the name of the nodeset in the Cubit `bc.jou` file.
#
# We constrain the displacement component perpendicular to the boundary on the
# +x, -x, and -y boundaries.
[pylithapp.problem.bc.bc_xneg]
constrained_dof = [0]
label = boundary_xneg
label_value = 1
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC -x

[pylithapp.problem.bc.bc_xpos]
constrained_dof = [0]
label = boundary_xpos
label_value = 2
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC +x

[pylithapp.problem.bc.bc_yneg]
constrained_dof = [1]
label = boundary_yneg
label_value = 3
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC -y

[pylithapp.problem.bc.bc_ypos]
constrained_dof = [1]
label = boundary_ypos
label_value = 4
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC +z

# Set the flow on the cavity
[pylithapp.problem.bc.cavity]
constrained_dof = [0]
label = boundary_cavity
label_value = 7
field = pressure

use_initial = True
use_time_history = True
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Flow out of the cavity
db_auxiliary_field.values = [initial_amplitude, time_history_amplitude, time_history_start_time]
db_auxiliary_field.data = [1.0*MPa, 1.0*MPa, 0.0*year]

time_history = spatialdata.spatialdb.TimeHistory
time_history.description = Pressure time history
time_history.filename = pve_shells_2d.timedb


[pylithapp.problem.bc.outer_chamber]
constrained_dof = [0]
label = boundary_outer_chamber
label_value = 5
field = pressure
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Flow out of the inner chamber
db_auxiliary_field.values = [initial_amplitude]
db_auxiliary_field.data = [0.0*MPa]



# End of file
